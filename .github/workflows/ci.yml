---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint -s -c .yamllint.yml .github/workflows

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --release --all-targets

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo build --locked --all-targets

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri on page, CRC and prereg unit tests
        run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer on the engine tests (includes the statx FFI)
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --release --test engine
        env:
          RUSTFLAGS: -Zsanitizer=address

  crash:
    name: registered crashes (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [fpi, atomic, unprotected]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: 10k crashes, threshold from prereg.toml (unprotected must find torn pages)
        run: ./target/release/wal-atomic-bench crash --mode ${{ matrix.mode }} --threads 4

  bytes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: WAL bytes per transaction, FPI vs atomic, registered sizes
        run: ./target/release/wal-atomic-bench bytes --interval all
      - name: RWF_ATOMIC detection on the runner (report only)
        run: ./target/release/wal-atomic-bench detect .
